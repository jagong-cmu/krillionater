<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Krillionater settings</title>
    <style>
      body { font: 14px/1.5 system-ui, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; color: #1b2433; }
      h1 { font-size: 20px; }
      label { display: block; margin: 16px 0 4px; font-weight: 600; }
      input[type="password"], select { width: 100%; padding: 8px; font: inherit; box-sizing: border-box; }
      .row { display: flex; align-items: center; gap: 8px; margin-top: 16px; }
      .row label { margin: 0; font-weight: 400; }
      button { margin-top: 20px; padding: 8px 16px; font: inherit; cursor: pointer; }
      p.hint { color: #5a6a85; font-size: 13px; margin: 4px 0 0; }
      #status { margin-left: 12px; color: #1a7f4b; }
    </style>
  </head>
  <body>
    <h1>Krillionater settings</h1>
    <label for="apiKey">Claude API key</label>
    <input id="apiKey" type="password" placeholder="sk-ant-…" autocomplete="off" />
    <p class="hint">The extension stores the key in this browser only. It sends the key only to api.anthropic.com.</p>
    <label for="model">Model</label>
    <select id="model"></select>
    <p class="hint">A faster model shows answers sooner. A more capable model finds rarer answers.</p>
    <div class="row">
      <input id="fast" type="checkbox" />
      <label for="fast">Fast mode (Opus 5.5 and Fable 5.2 only, costs more)</label>
    </div>
    <button id="save">Save</button><span id="status"></span>
    <script src="dist/options.js"></script>
  </body>
</html>
