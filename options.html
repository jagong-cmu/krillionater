<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Krillionater settings</title>
    <style>
      body { font: 14px/1.5 system-ui, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; color: #1b2433; }
      h1 { font-size: 20px; }
      label { display: block; margin: 16px 0 4px; font-weight: 600; }
      input[type="password"], input[type="text"], select { width: 100%; padding: 8px; font: inherit; box-sizing: border-box; }
      .row { display: flex; align-items: center; gap: 8px; margin-top: 16px; }
      .row label { margin: 0; font-weight: 400; }
      button { margin-top: 20px; padding: 8px 16px; font: inherit; cursor: pointer; }
      p.hint { color: #5a6a85; font-size: 13px; margin: 4px 0 0; }
      #status { margin-left: 12px; color: #1a7f4b; }
    </style>
  </head>
  <body>
    <h1>Krillionater settings</h1>
    <label for="provider">Answer provider</label>
    <select id="provider"></select>
    <label for="apiKey" id="keyLabel">API key</label>
    <input id="apiKey" type="password" autocomplete="off" />
    <p class="hint" id="keyHint"></p>
    <label for="model">Model</label>
    <input id="model" type="text" list="models" autocomplete="off" spellcheck="false" />
    <datalist id="models"></datalist>
    <p class="hint">Select a model from the list, or type a different model ID. This model makes the RARE list. A more capable model finds rarer answers, but it is slower.</p>
    <p class="hint" id="quickHint"></p>
    <div class="row" id="fastRow">
      <input id="fast" type="checkbox" />
      <label for="fast">Priority speed for Opus 5.5 and Fable 5.2 (costs more)</label>
    </div>
    <button id="save">Save</button><span id="status"></span>
    <script src="dist/options.js"></script>
  </body>
</html>
